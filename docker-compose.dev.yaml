services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: builder
      args:
        # Dockerfile.dev declares this ARG; without a value it sets the env var
        # to "" and masks .env during `next build`. Compose reads ./.env here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    container_name: pude-web
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./next.config.ts:/app/next.config.ts
      - /app/node_modules
      - /app/.next
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
